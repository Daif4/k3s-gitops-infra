---
# ==========================================
# 1. СТЕК REDIS (КЭШИРОВАНИЕ)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: default
  labels:
    app: nextcloud-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-redis
  template:
    metadata:
      labels:
        app: nextcloud-redis
    spec:
      containers:
      - name: redis
        image: dh-mirror.gitverse.ru/library/redis:7-alpine
        command: ["redis-server", "--requirepass", "supersecretredis"]
        ports:
        - containerPort: 6379
          name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis-svc
  namespace: default
spec:
  selector:
    app: nextcloud-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
# ==========================================
# 2. СТЕК POSTGRESQL (БАЗА ДАННЫХ)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-postgres
  namespace: default
  labels:
    app: nextcloud-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-postgres
  template:
    metadata:
      labels:
        app: nextcloud-postgres
    spec:
      containers:
      - name: postgres
        image: dh-mirror.gitverse.ru/library/postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: nextcloud_db
        - name: POSTGRES_USER
          value: nextcloud_user
        - name: POSTGRES_PASSWORD
          value: supersecretpgpass
        ports:
        - containerPort: 5432
          name: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-postgres-svc
  namespace: default
spec:
  selector:
    app: nextcloud-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
# ==========================================
# 3. СТЕК NEXTCLOUD (ВЕБ-ПРИЛОЖЕНИЕ)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: default
  labels:
    app: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
      - name: nextcloud
        image: dh-mirror.gitverse.ru/library/nextcloud:stable
        env:
        # Настройки подключения к Postgres
        - name: POSTGRES_HOST
          value: nextcloud-postgres-svc
        - name: POSTGRES_DB
          value: nextcloud_db
        - name: POSTGRES_USER
          value: nextcloud_user
        - name: POSTGRES_PASSWORD
          value: supersecretpgpass
        # Настройки подключения к Redis
        - name: REDIS_HOST
          value: nextcloud-redis-svc
        - name: REDIS_HOST_PASSWORD
          value: supersecretredis
        ports:
        - containerPort: 80
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-service
  namespace: default
spec:
  type: NodePort 
  selector:
    app: nextcloud
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080 # <-- 2. ХАРДКОДИМ ВЕЧНЫЙ ПОРТ НА ФИЗИЧЕСКИХ ХОСТАХ
